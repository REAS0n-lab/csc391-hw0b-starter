# Offline checks for the HW0b starter.
#
# test_jobs.py checks the structure of the Slurm scripts, which is a real
# check that needs no scheduler. test_collect.py is the specification for the
# two functions you write in scripts/collect.py, and it fails until you write
# them. That failure is expected on a fresh clone.
#
# Every check here is worth zero points.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r env/requirements.txt

      - name: Job scripts are well formed
        run: python -m pytest tests/test_jobs.py -q

      - name: Shell syntax
        run: |
          for f in submit.sh validate.sh env/setup.sh jobs/*.slurm; do
            bash -n "$f" || exit 1
          done
          echo "all shell and job scripts parse"

      - name: Collection script
        run: python -m pytest tests/test_collect.py -q
